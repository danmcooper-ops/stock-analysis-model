# Local hooks deliberately run the repo's own pinned dev tools (installed
# via `pip install -e ".[dev]"`) rather than pre-commit's vendored copies,
# so the hook, CI, and a bare terminal all agree on tool versions.
#
# One-time setup:  pip install -e ".[dev]" && pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: python3 -m ruff check .
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest (offline suite)
        entry: python3 -m pytest -m "not network and not slow" -q
        language: system
        pass_filenames: false
        types: [python]
        exclude: ^(bonds|currencies)/
      # The subprojects test on their own venvs (scripts/setup_submodels.sh).
      - id: pytest-bonds
        name: pytest (bonds/)
        entry: bash -c 'cd bonds && .venv/bin/python -m pytest -q'
        language: system
        pass_filenames: false
        files: ^bonds/
      - id: pytest-currencies
        name: pytest (currencies/)
        entry: bash -c 'cd currencies && .venv/bin/python -m pytest -q'
        language: system
        pass_filenames: false
        files: ^currencies/
