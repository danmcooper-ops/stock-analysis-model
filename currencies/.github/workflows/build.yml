name: Build and publish currency screener

# Builds the report and deploys it straight to GitHub Pages in one job.
#
# An earlier version split this in two — build pushed a `pages-live` branch
# and a second workflow deployed on push to it. That chain cannot work:
# push-triggered workflows are read from the *pushed branch's* tree, and
# `pages-live` holds only docs/, so there was no workflow file there to run.
# Deploying the artifact directly removes the coupling entirely.
#
# `pages-live` is still updated, but only as a fallback: it lets Pages serve
# the site via Settings > Pages > "Deploy from a branch" without Actions
# running at all. Nothing in this workflow depends on it.

on:
  schedule:
    # Target: 16:15 America/New_York, weekdays.
    #
    # Cron here is fixed-UTC, and 16:15 New York is 20:15 UTC under EDT but
    # 21:15 UTC under EST. Both are registered; scripts/should_build.py
    # discards any run starting before 16:00 local, and any run after one
    # has already published today, so neither cron needs editing at the DST
    # boundaries. GitHub often starts these hours late — the gate tolerates
    # that rather than dropping late runs.
    #
    # Day-of-week is evaluated in UTC, but at 20-21 UTC the New York date is
    # the same calendar day, so 1-5 really does mean Mon-Fri locally.
    - cron: '15 20 * * 1-5'   # 16:15 EDT
    - cron: '15 21 * * 1-5'   # 16:15 EST
  workflow_dispatch:
  push:
    # The github-pages environment only accepts deployments from the
    # repository's default branch. This repo's default is still the branch it
    # was first pushed to (claude/currency-screener-html-cn960n), not main, so
    # a run triggered only by main is rejected before it reaches a runner —
    # two seconds, no steps, no logs. Both branches are listed until the
    # default is switched to main, after which the second entry can go.
    branches:
      - main
      - claude/currency-screener-html-cn960n
    paths:
      - 'data/**'
      - 'models/**'
      - 'scripts/**'
      - 'templates/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Upstream responses are cached on disk by data/cache.py. Restoring the
      # cache means a World Bank outage on build day is served from the last
      # good response instead of emptying the External pillar — the same
      # stale-serve path the clients use locally.
      - name: Restore API cache
        uses: actions/cache@v6
        with:
          path: data/cache
          key: api-cache-${{ github.run_id }}
          restore-keys: api-cache-

      # Scheduled runs only: drop the wrong-DST cron, and skip days the ECB
      # published nothing (TARGET holiday, weekend, or an outage). Manual and
      # push-triggered runs always build. A skip is not a failure, so this
      # gates the later steps rather than exiting non-zero.
      - id: gate
        name: Should this run build?
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Last publish time from the pages-live mirror. Empty if the
            # branch does not exist or the fetch fails, which the gate
            # treats as "not built today".
            last_built="$(git fetch --quiet --depth=1 origin pages-live 2>/dev/null \
              && git log -1 --format=%ct FETCH_HEAD || true)"
            python scripts/should_build.py --tz America/New_York --hour 16 \
              --last-built "$last_built"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "reason=${{ github.event_name }} trigger — always builds" >> "$GITHUB_OUTPUT"
            echo "proceed=true (${{ github.event_name }} trigger)"
          fi

      - name: Skipped
        if: steps.gate.outputs.proceed != 'true'
        run: echo "::notice title=Build skipped::${{ steps.gate.outputs.reason }}"

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: pip install -r requirements.txt

      - name: Run tests
        if: steps.gate.outputs.proceed == 'true'
        run: python -m pytest -q

      - name: Build report
        if: steps.gate.outputs.proceed == 'true'
        run: python scripts/analyze_currencies.py

      - name: Gate coverage report
        if: steps.gate.outputs.proceed == 'true'
        run: python scripts/gate_coverage.py output/results_*.json

      - name: Stage docs
        if: steps.gate.outputs.proceed == 'true'
        run: python scripts/publish_pages.py

      # `enablement: true` can only create the Pages site if the token is
      # allowed to; on a repository where Pages has never been turned on it
      # fails with "Resource not accessible by integration". That is a
      # one-time owner action (Settings > Pages), so it must not fail the
      # build — the report is still built and mirrored below.
      - id: pages
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/configure-pages@v6
        continue-on-error: true
        with:
          enablement: true

      # v4+ drops dotfiles by default; keep .nojekyll so the artifact matches
      # the pages-live mirror exactly.
      - if: steps.gate.outputs.proceed == 'true' && steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          include-hidden-files: true

      - id: deployment
        if: steps.gate.outputs.proceed == 'true' && steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v5

      # Two distinct causes land here and the fix differs, so name both:
      # Pages never enabled at all, or enabled with Source set to "Deploy from
      # a branch" (in which case Pages serves that branch and ignores this
      # workflow's artifact entirely).
      - name: Pages not deployable
        if: steps.gate.outputs.proceed == 'true' && steps.pages.outcome != 'success'
        run: |
          echo "::warning title=Pages artifact not deployed::Built the report \
          but could not deploy it. Either Pages is off, or its Source is set \
          to 'Deploy from a branch' — this workflow can only publish when \
          Source is 'GitHub Actions'. Fix: Settings > Pages > Source > GitHub \
          Actions, then re-run. To serve from a branch instead, point it at \
          pages-live / docs, which this job keeps current."

      # Archival copy. Single-commit orphan branch, force-pushed each run, so
      # the ~660 KB daily report never accumulates in git history. Runs even
      # when the deploy failed, so pages-live still holds the current report
      # and can serve the site via "Deploy from a branch".
      #
      # The gate condition is load-bearing, not belt-and-braces: on a skipped
      # day docs/ is never built, and an unguarded always() would force-push an
      # empty docs/ and wipe the branch.
      - name: Mirror to pages-live
        if: always() && steps.gate.outputs.proceed == 'true'
        continue-on-error: true
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -r docs/. "$tmp/"
          git checkout --orphan pages-live
          git rm -rf --cached . >/dev/null 2>&1 || true
          rm -rf docs && mkdir -p docs
          cp -r "$tmp/." docs/
          git add -f docs
          git commit -m "Publish currency screener $(date -u +%Y-%m-%d)"
          git push -f origin pages-live
