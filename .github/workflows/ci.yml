name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test (offline suite, coverage-gated)
        # Ratchet convention: --cov-fail-under is a floor, never a target.
        # When coverage rises, bump the floor to match; never lower it.
        run: pytest -m "not network and not slow" -q --cov --cov-report=term --cov-fail-under=33
