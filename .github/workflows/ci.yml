name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test (offline suite, coverage-gated)
        # Ratchet convention: --cov-fail-under is a floor, never a target.
        # When coverage rises, bump the floor to match; never lower it.
        run: pytest -m "not network and not slow" -q --cov --cov-report=term --cov-fail-under=63

  # Supabase schema (design/supabase-migration.md). Applies supabase/migrations
  # to the Supabase Postgres image and runs the `pg` tests against it.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Lint migrations (squawk)
        run: npx -y squawk-cli@2.66.0 supabase/migrations/*.sql

      - name: Start Postgres and apply migrations
        run: supabase db start

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Schema, publish and reader tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pytest -m pg -q tests/test_db_schema.py tests/test_db_publish_pg.py tests/test_db_reader_pg.py tests/test_db_objects_pg.py tests/test_db_scale.py tests/test_db_cutover.py
